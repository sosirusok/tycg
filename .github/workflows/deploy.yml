name: Deploy to Cloudflare

# One-time setup (repository Settings > Secrets and variables > Actions > New repository secret):
#   CLOUDFLARE_API_TOKEN   required  API token from the "Edit Cloudflare Workers" template,
#                                    plus the permission Account > D1 > Edit
#   MANAGER_PASSWORD       required  password (8+ characters) for the reserved manager account
#                                    (sosirusok / 우와오). Used only to create that account; the deploy
#                                    fails while the account does not exist and this secret is missing.
#   CLOUDFLARE_ACCOUNT_ID  optional  needed only when the token can see more than one account
# Optional repository variables: WORKERS_SUBDOMAIN (wanted <name>.workers.dev), USE_R2 ("false" keeps photos in D1),
# USE_KV ("false" keeps photos in D1 while R2 is off), CRON_LIMIT (the account's Cron Trigger limit: 5 on
# Workers Free, the default; 250 on Workers Paid).
# Web push (VAPID) keys need no setup: the deploy makes them once as Worker secrets and never replaces them.
# Without CLOUDFLARE_API_TOKEN every run ends green with a notice and changes nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  WORKER_NAME: zombiego-market
  D1_NAME: zombiego-market-db
  D1_LOCATION: apac
  R2_BUCKET: zombiego-market-uploads
  KV_TITLE: zombiego-market-photos
  WRANGLER_SEND_METRICS: "false"
  NO_COLOR: "1"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Cloudflare 배포 건너뜀::CLOUDFLARE_API_TOKEN 저장소 비밀값이 없어 배포하지 않았습니다. README의 '서버 배포' 절차대로 한 번만 등록하면 이후 main에 반영될 때마다 자동 배포됩니다."
          {
            echo "### Cloudflare 배포를 건너뛰었습니다"
            echo ""
            echo "저장소 Settings > Secrets and variables > Actions에 \`CLOUDFLARE_API_TOKEN\`(필수)과 \`MANAGER_PASSWORD\`를 등록한 뒤"
            echo "Actions 탭에서 이 워크플로를 다시 실행하세요."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_API: https://api.cloudflare.com/client/v4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
          cache: true
      - run: pnpm install --frozen-lockfile

      - name: Resolve Cloudflare account
        env:
          GIVEN_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -n "${GIVEN_ACCOUNT_ID:-}" ]; then
            id="$GIVEN_ACCOUNT_ID"
          else
            res="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/accounts?per_page=50")"
            if [ "$(jq -r '.success' <<<"$res")" != "true" ]; then
              echo "::error::API 토큰을 확인하지 못했습니다: $(jq -c '[.errors[]?|{code,message}]' <<<"$res")"
              exit 1
            fi
            count="$(jq '.result | length' <<<"$res")"
            if [ "$count" != "1" ]; then
              echo "::error::토큰으로 접근 가능한 계정이 ${count}개입니다. 저장소 비밀값 CLOUDFLARE_ACCOUNT_ID에 배포할 계정 ID를 넣어 주세요."
              exit 1
            fi
            id="$(jq -r '.result[0].id' <<<"$res")"
          fi
          if ! [[ "$id" =~ ^[0-9a-f]{32}$ ]]; then echo "::error::Cloudflare 계정 ID 형식이 올바르지 않습니다."; exit 1; fi
          echo "::add-mask::$id"
          echo "CLOUDFLARE_ACCOUNT_ID=$id" >> "$GITHUB_ENV"

      - name: Ensure D1 database exists and resolve its id
        run: |
          set -euo pipefail
          find_id() {
            ./node_modules/.bin/wrangler d1 list --json | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const a = s.indexOf("["), b = s.lastIndexOf("]");
                if (a < 0 || b < a) { console.error("wrangler d1 list did not return JSON"); process.exit(2); }
                const hit = JSON.parse(s.slice(a, b + 1)).find(d => d.name === process.env.D1_NAME);
                process.stdout.write(hit ? hit.uuid : "");
              });'
          }
          id="$(find_id)"
          if [ -z "$id" ]; then
            echo "Creating D1 database $D1_NAME"
            ./node_modules/.bin/wrangler d1 create "$D1_NAME" --location "$D1_LOCATION"
            for attempt in 1 2 3 4 5; do
              id="$(find_id)"
              [ -n "$id" ] && break
              sleep 3
            done
          fi
          if ! [[ "$id" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "::error::D1 ID를 확인하지 못했습니다. API 토큰에 Account > D1 > Edit 권한이 있는지 확인하세요."
            exit 1
          fi
          echo "D1_ID=$id" >> "$GITHUB_ENV"

      - name: Detect or create R2 bucket (optional)
        env:
          USE_R2: ${{ vars.USE_R2 }}
        run: |
          set -uo pipefail
          r2=false
          if [ "${USE_R2:-}" = "false" ]; then
            echo "R2 disabled by repository variable USE_R2=false"
          else
            # Only a confirmed 'no R2 subscription' (10042) switches photos to D1. Any other
            # failure stops the deploy, so a transient error never drops a bucket that is in use.
            for attempt in 1 2 3; do
              body="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$R2_BUCKET" || true)"
              codes="$(jq -r '[.errors[]?.code] | map(tostring) | join(",")' <<<"$body" 2>/dev/null || echo "")"
              if [ "$(jq -r '.success' <<<"$body" 2>/dev/null)" = "true" ]; then r2=true; decided=1; break; fi
              if [[ ",$codes," == *",10006,"* ]]; then
                if ./node_modules/.bin/wrangler r2 bucket create "$R2_BUCKET"; then r2=true; decided=1; break; fi
              fi
              if [[ ",$codes," == *",10042,"* ]]; then decided=1; break; fi
              sleep 5
            done
            if [ -z "${decided:-}" ]; then
              echo "::error::R2 상태를 확인하지 못했습니다(오류 코드: ${codes:-응답 없음}). 토큰에 Workers R2 Storage 권한이 있는지 확인하거나, R2를 쓰지 않으려면 저장소 변수 USE_R2를 false로 지정하세요."
              exit 1
            fi
            if [ "$r2" != "true" ]; then
              echo "::notice title=R2 미사용::이 계정은 R2에 가입되어 있지 않아(10042) R2 없이 배포합니다. 사진은 KV(없으면 D1)에 저장합니다."
            fi
          fi
          echo "R2_ENABLED=$r2" >> "$GITHUB_ENV"

      # Photos go to KV while R2 is off (KV Free: 1GB). The namespace is found by its title, or created
      # once when R2 is off; nothing is ever deleted or replaced. With R2 on, an existing namespace is still
      # bound so the R2 mover can copy its photos. The listing is retried, and a listing that still fails
      # stops the deploy: dropping the binding of a namespace in use would make every KV photo disappear.
      # Only a failed create (no namespace yet, nothing to lose) leaves photos in D1 and goes on.
      - name: Find or create the KV namespace for photos (optional)
        env:
          USE_KV: ${{ vars.USE_KV }}
        run: |
          set -uo pipefail
          kv=""
          # Only while R2 is off does a missing namespace mean photos in D1.
          warn() {
            if [ "$R2_ENABLED" = "true" ]; then echo "$1"
            else echo "::warning title=KV 미사용::$1 이번 배포는 사진을 D1에 저장합니다."; fi
          }
          find_kv() {
            ./node_modules/.bin/wrangler kv namespace list 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const a = s.indexOf("["), b = s.lastIndexOf("]");
                if (a < 0 || b < a) process.exit(2);
                const hit = JSON.parse(s.slice(a, b + 1)).find(n => n.title === process.env.KV_TITLE);
                process.stdout.write(hit ? hit.id : "");
              });'
          }
          if [ "${USE_KV:-}" = "false" ]; then
            echo "KV disabled by repository variable USE_KV=false"
            echo "KV_ID=" >> "$GITHUB_ENV"
            exit 0
          fi
          listed=""
          for attempt in 1 2 3; do
            if kv="$(find_kv)"; then listed=1; break; fi
            kv=""
            sleep 5
          done
          if [ -z "$listed" ]; then
            echo "::error::KV 저장소 목록을 확인하지 못했습니다. 토큰에 Workers KV Storage 권한이 있는지 확인하거나, KV를 쓰지 않으려면 저장소 변수 USE_KV를 false로 지정하세요."
            exit 1
          fi
          if [ -z "$kv" ] && [ "$R2_ENABLED" != "true" ]; then
            echo "Creating KV namespace $KV_TITLE"
            if ./node_modules/.bin/wrangler kv namespace create "$KV_TITLE" --update-config=false; then
              for attempt in 1 2 3 4 5; do
                kv="$(find_kv || true)"
                [ -n "$kv" ] && break
                sleep 3
              done
            fi
            [ -n "$kv" ] || warn "KV 저장소 $KV_TITLE 을(를) 만들지 못했습니다."
          fi
          if [ -n "$kv" ] && ! [[ "$kv" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::KV 저장소 ID 형식이 올바르지 않습니다($kv). KV를 쓰지 않으려면 저장소 변수 USE_KV를 false로 지정하세요."
            exit 1
          fi
          echo "KV_ID=$kv" >> "$GITHUB_ENV"

      - name: Put real ids into wrangler.jsonc (runner copy only, never committed)
        # Must run before `vite build`: @cloudflare/vite-plugin copies bindings into the build output.
        run: |
          node - <<'JS'
          const path = require("path");
          const { experimental_readRawConfig, experimental_patchConfig } = require("wrangler");
          const file = path.resolve("wrangler.jsonc");
          const { rawConfig } = experimental_readRawConfig({ config: file });
          if (rawConfig.name !== process.env.WORKER_NAME) throw new Error(`wrangler name "${rawConfig.name}" != WORKER_NAME`);
          const idx = (rawConfig.d1_databases || []).findIndex((d) => d.binding === "DB");
          if (idx < 0) throw new Error("DB binding missing in wrangler.jsonc");
          const d1 = rawConfig.d1_databases.map(() => ({}));
          d1[idx] = { database_id: process.env.D1_ID, database_name: process.env.D1_NAME };
          experimental_patchConfig(file, { d1_databases: d1 }, false);
          if (process.env.R2_ENABLED === "true") {
            if (!(rawConfig.r2_buckets || []).some((b) => b.binding === "BUCKET")) {
              experimental_patchConfig(file, { r2_buckets: [{ binding: "BUCKET", bucket_name: process.env.R2_BUCKET }] }, true);
            }
          } else if (rawConfig.r2_buckets) {
            // Otherwise deploy's auto-provisioning tries to create the bucket and fails (10042).
            experimental_patchConfig(file, { r2_buckets: undefined }, false);
          }
          // KV photos (PHOTOS), when the KV step found or made the namespace.
          if (/^[0-9a-f]{32}$/.test(process.env.KV_ID || "") && !(rawConfig.kv_namespaces || []).some((k) => k.binding === "PHOTOS")) {
            experimental_patchConfig(file, { kv_namespaces: [{ binding: "PHOTOS", id: process.env.KV_ID }] }, true);
          }
          const after = experimental_readRawConfig({ config: file }).rawConfig;
          if (after.d1_databases[idx].database_id !== process.env.D1_ID) throw new Error("database_id injection failed");
          if (process.env.R2_ENABLED !== "true" && after.r2_buckets?.length) throw new Error("r2_buckets removal failed");
          const kvOn = (after.kv_namespaces || []).some((k) => k.binding === "PHOTOS");
          console.log(`config ready: D1 ${process.env.D1_NAME}, R2 ${process.env.R2_ENABLED === "true" ? "on" : "off"}, KV ${kvOn ? "on" : "off"}`);
          JS

      - run: pnpm typecheck
      - run: pnpm build

      # Workers Free allows 5 Cron Triggers per account. wrangler deploy sets this Worker's triggers only
      # after the new code is live, so a refused update would leave the site without its 10-minute ticks
      # (자동 끌올, 새 글 알림). This read-only check counts the other Workers' triggers first and stops before
      # the migrations when they would not fit. A failed read only warns: the deploy goes on as before.
      - name: Check the account's Cron Trigger limit (read-only)
        env:
          CRON_LIMIT: ${{ vars.CRON_LIMIT }}
        run: |
          set -uo pipefail
          api() { curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$@"; }
          skip() { echo "::warning title=Cron Trigger 확인 건너뜀::$1 배포는 그대로 진행합니다."; exit 0; }
          ours="$(node -e '
            const { experimental_readRawConfig } = require("wrangler");
            const { rawConfig } = experimental_readRawConfig({ config: require("path").resolve("wrangler.jsonc") });
            process.stdout.write(String((rawConfig.triggers?.crons || []).length));' 2>/dev/null)" || ours=""
          limit="${CRON_LIMIT:-5}"
          [[ "$ours" =~ ^[0-9]+$ ]] || skip "wrangler.jsonc의 Cron Trigger 수를 읽지 못했습니다."
          [[ "$limit" =~ ^[0-9]+$ ]] || skip "저장소 변수 CRON_LIMIT는 숫자여야 합니다."
          [ "$ours" -gt 0 ] || exit 0
          list="$(api "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" || true)"
          [ "$(jq -r '.success' <<<"$list" 2>/dev/null)" = "true" ] || skip "계정의 Worker 목록을 읽지 못했습니다."
          others=0
          used=""
          while IFS= read -r name; do
            if [ -z "$name" ] || [ "$name" = "$WORKER_NAME" ]; then continue; fi
            res="$(api "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$(jq -rn --arg n "$name" '$n|@uri')/schedules" || true)"
            [ "$(jq -r '.success' <<<"$res" 2>/dev/null)" = "true" ] || skip "Worker $name 의 Cron Trigger를 읽지 못했습니다."
            n="$(jq '[(.result.schedules // [])[]? | select(.cron != null)] | length' <<<"$res" 2>/dev/null)" || n=""
            [[ "$n" =~ ^[0-9]+$ ]] || skip "Worker $name 의 Cron Trigger 수를 읽지 못했습니다."
            if [ "$n" -gt 0 ]; then others=$((others + n)); used="$used $name($n)"; fi
          done < <(jq -r '.result[]?.id // empty' <<<"$list")
          total=$((others + ours))
          echo "Cron Triggers: 다른 Worker ${others}개 + 이 사이트 ${ours}개 = ${total}개 (한도 ${limit}개)"
          if [ "$total" -gt "$limit" ]; then
            room=$((limit - ours)); [ "$room" -ge 0 ] || room=0
            echo "::error title=Cron Trigger 한도 초과::이 사이트는 Cron Trigger ${ours}개(10분마다 자동 끌올·새 글 알림, 매일 정리)가 필요한데, 같은 Cloudflare 계정의 다른 Worker가 ${others}개를 쓰고 있어 합계 ${total}개로 한도 ${limit}개(무료 플랜 5개)를 넘습니다:${used}. 다른 Worker의 Cron Trigger를 합계 ${room}개 이하로 줄이고 다시 실행하세요. 유료 플랜이면 저장소 변수 CRON_LIMIT에 250을 넣으세요. D1 마이그레이션과 배포 전에 멈췄습니다."
            exit 1
          fi

      - name: Apply D1 migrations (remote)
        run: pnpm exec wrangler d1 migrations apply DB --remote --config wrangler.jsonc

      - name: Check that the manager account exists or can be created
        env:
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          MANAGER_PASSWORD_HASH: ${{ secrets.MANAGER_PASSWORD_HASH }}
          MANAGER_PASSWORD_SALT: ${{ secrets.MANAGER_PASSWORD_SALT }}
        run: |
          set -euo pipefail
          out="$(pnpm exec wrangler d1 execute DB --remote --config wrangler.jsonc --json --command "SELECT COUNT(*) AS n FROM users WHERE id='manager'")"
          n="$(node -e 'const s=process.argv[1]; const j=JSON.parse(s.slice(s.indexOf("["))); process.stdout.write(String(j[0].results[0].n))' "$out")"
          if [ "$n" = "1" ]; then echo "Manager account exists."; exit 0; fi
          if [ -n "$MANAGER_PASSWORD" ] || { [ -n "$MANAGER_PASSWORD_HASH" ] && [ -n "$MANAGER_PASSWORD_SALT" ]; }; then
            echo "The manager account will be created from the MANAGER_PASSWORD secret."; exit 0
          fi
          echo "::error::매니저 계정(sosirusok / 우와오)이 아직 없습니다. 저장소 Settings > Secrets and variables > Actions에 MANAGER_PASSWORD(8자 이상)를 등록하고 다시 실행해 주세요. 매니저 계정이 없으면 인증/등급 신청을 받을 수 없습니다."
          exit 1

      - name: Ensure the account workers.dev subdomain
        env:
          WANTED_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          url="$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          res="$(api "$url")"
          sub="$(jq -r '.result.subdomain // empty' <<<"$res")"
          if [ -z "$sub" ]; then
            base="$(printf '%s' "${WANTED_SUBDOMAIN:-$GITHUB_REPOSITORY_OWNER}" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9' '-' | sed -E 's/-+/-/g; s/^-//' | cut -c1-40 | sed -E 's/-+$//')"
            [ -n "$base" ] || base="zombiego"
            for cand in "$base" "$base-$(openssl rand -hex 3)"; do
              [[ "$cand" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]] || continue
              put="$(api -X PUT --data "$(jq -cn --arg s "$cand" '{subdomain:$s}')" "$url")"
              sub="$(jq -r '.result.subdomain // empty' <<<"$put")"
              [ -n "$sub" ] && break
            done
            if [ -z "$sub" ]; then
              echo "::error::workers.dev 주소를 등록하지 못했습니다. 저장소 변수 WORKERS_SUBDOMAIN에 다른 이름을 넣고 다시 실행해 주세요."
              exit 1
            fi
            echo "::notice::workers.dev 주소 $sub 을 등록했습니다. 처음에는 연결까지 몇 분 걸릴 수 있습니다."
          fi
          echo "WORKERS_URL=https://$WORKER_NAME.$sub.workers.dev" >> "$GITHUB_ENV"

      # Web push (WP64). Reads only the names of the Worker's secrets, never their values. make=keys only when
      # the list lacks VAPID_PRIVATE_KEY (or the Worker does not exist yet, API code 10007); make=subject when
      # only VAPID_SUBJECT is missing. Keys that exist are never made again or replaced, so the members'
      # subscriptions survive every deploy. A list that cannot be read makes nothing and the deploy goes on.
      - name: Check the web push keys (VAPID, read-only)
        id: vapid
        run: |
          set -uo pipefail
          make=none
          if out="$(./node_modules/.bin/wrangler secret list --config wrangler.jsonc --format json 2>"$RUNNER_TEMP/secret-list.log")" \
            && names="$(node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const a = s.indexOf("["), b = s.lastIndexOf("]");
                if (a < 0 || b < a) process.exit(2);
                const list = JSON.parse(s.slice(a, b + 1));
                if (!Array.isArray(list)) process.exit(2);
                process.stdout.write(list.map(x => x && x.name).filter(Boolean).join(","));
              });' <<<"$out")"; then
            if [[ ",$names," == *",VAPID_PRIVATE_KEY,"* ]]; then
              echo "웹 푸시 키가 이미 있습니다. 그대로 둡니다."
              [[ ",$names," == *",VAPID_SUBJECT,"* ]] || make=subject
            else
              make=keys
            fi
          else
            # Only a Worker that does not exist yet (first deploy) has no keys to keep.
            res="$(curl -sS --max-time 20 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$CF_API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets" || true)"
            codes="$(jq -r '[.errors[]?.code] | map(tostring) | join(",")' <<<"$res" 2>/dev/null || true)"
            if [[ ",$codes," == *",10007,"* ]]; then
              make=keys
            else
              echo "::warning title=웹 푸시 키 확인 건너뜀::Worker 비밀값 목록을 읽지 못해 이번 배포에서는 웹 푸시 키를 만들지 않습니다(오류 코드: ${codes:-응답 없음}). 이미 있는 키는 그대로 남고, 다음 배포에서 다시 확인합니다."
            fi
          fi
          echo "Web push keys: $make"
          echo "make=$make" >> "$GITHUB_OUTPUT"

      - name: Prepare Worker secrets (only values that are set)
        env:
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          MANAGER_PASSWORD_HASH: ${{ secrets.MANAGER_PASSWORD_HASH }}
          MANAGER_PASSWORD_SALT: ${{ secrets.MANAGER_PASSWORD_SALT }}
          VAPID_MAKE: ${{ steps.vapid.outputs.make }}
        run: |
          set -euo pipefail
          umask 077
          node - <<'JS'
          const fs = require("fs");
          const out = {};
          if (process.env.MANAGER_PASSWORD) {
            if (process.env.MANAGER_PASSWORD.length < 8) throw new Error("MANAGER_PASSWORD는 8자 이상이어야 합니다.");
            out.MANAGER_PASSWORD = process.env.MANAGER_PASSWORD;
          }
          const pair = ["MANAGER_PASSWORD_HASH", "MANAGER_PASSWORD_SALT"].filter((n) => process.env[n]);
          if (pair.length === 1) throw new Error("MANAGER_PASSWORD_HASH와 MANAGER_PASSWORD_SALT는 함께 등록해야 합니다.");
          for (const n of pair) out[n] = process.env[n];
          // Web push keys, only when the check step found none: a P-256 key pair, the private key as a JWK
          // and the public key as the base64url of its 65-byte point; the subject is the site's address.
          // A failure here only skips push for this deploy.
          try {
            if (process.env.VAPID_MAKE === "keys") {
              const { generateKeyPairSync } = require("crypto");
              const { privateKey, publicKey } = generateKeyPairSync("ec", { namedCurve: "P-256" });
              const { kty, crv, x, y, d } = privateKey.export({ format: "jwk" });
              const pub = publicKey.export({ format: "jwk" });
              out.VAPID_PRIVATE_KEY = JSON.stringify({ kty, crv, x, y, d });
              out.VAPID_PUBLIC_KEY = Buffer.concat([Buffer.from([4]), Buffer.from(pub.x, "base64url"), Buffer.from(pub.y, "base64url")]).toString("base64url");
            }
            if (process.env.VAPID_MAKE === "keys" || process.env.VAPID_MAKE === "subject") {
              if (!/^https:\/\/[^\s]+$/.test(process.env.WORKERS_URL || "")) throw new Error("WORKERS_URL is not an https address");
              out.VAPID_SUBJECT = process.env.WORKERS_URL;
              console.log(process.env.VAPID_MAKE === "keys" ? "Web push keys made; they go with this deploy." : "Web push subject added.");
            }
          } catch (e) {
            for (const n of ["VAPID_PRIVATE_KEY", "VAPID_PUBLIC_KEY", "VAPID_SUBJECT"]) delete out[n];
            console.log(`::warning title=웹 푸시 키 생성 실패::웹 푸시 키를 만들지 못해 이번 배포는 알림 없이 진행합니다(${e.message}). 다음 배포에서 다시 만듭니다.`);
          }
          if (!Object.keys(out).length) { console.log("No secrets to add; existing Worker secrets stay as they are."); process.exit(0); }
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/worker-secrets.json`, JSON.stringify(out));
          JS
          if [ -f "$RUNNER_TEMP/worker-secrets.json" ]; then
            echo "SECRETS_ARGS=--secrets-file $RUNNER_TEMP/worker-secrets.json" >> "$GITHUB_ENV"
          fi

      - name: Deploy
        run: |
          set -euo pipefail
          # vite build writes .wrangler/deploy/config.json pointing at dist/<worker>/wrangler.json.
          # Deploy that built config; the source wrangler.jsonc would re-bundle without assets.
          cfg="$(node -e '
            const fs = require("fs"), p = require("path"), f = ".wrangler/deploy/config.json";
            if (!fs.existsSync(f)) { console.error("missing " + f + " (did vite build run?)"); process.exit(1); }
            const c = JSON.parse(fs.readFileSync(f, "utf8"));
            process.stdout.write(p.relative(".", p.resolve(p.dirname(f), c.configPath)));')"
          echo "Deploying with $cfg"
          # --secrets-file is additive (other secrets are kept) and works on the very first deploy.
          pnpm exec wrangler deploy --config "$cfg" ${SECRETS_ARGS:-} --message "github ${GITHUB_SHA::7}"

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"

      - name: Check the live site
        env:
          VAPID_MAKE: ${{ steps.vapid.outputs.make }}
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$WORKERS_URL/api/health" | grep -q '"ok":true'; then echo "Healthy: $WORKERS_URL"; ok=1; break; fi
            sleep 10
          done
          push=""
          if [ -z "${ok:-}" ]; then
            echo "::warning::$WORKERS_URL/api/health 가 아직 응답하지 않습니다. 새 주소는 연결까지 몇 분 걸릴 수 있습니다."
          else
            config="$(curl -fsS "$WORKERS_URL/api/config" || true)"
            if ! jq -e '.manager.id == "manager"' > /dev/null 2>&1 <<<"$config"; then
              # /api/config creates the manager account from the secret on first use.
              echo "::error::사이트는 열렸지만 매니저 계정을 만들지 못했습니다. MANAGER_PASSWORD 비밀값(8자 이상)을 확인한 뒤 다시 실행해 주세요."
              exit 1
            fi
            # The new version may take a few seconds to answer everywhere.
            for i in 1 2 3 4 5 6; do
              if jq -e '(.vapidPublicKey // "") | length > 0' > /dev/null 2>&1 <<<"$config"; then push=on; break; fi
              sleep 5
              config="$(curl -fsS "$WORKERS_URL/api/config" || true)"
            done
            [ "$push" = on ] || echo "::warning title=웹 푸시 꺼짐::사이트에 웹 푸시 키가 아직 없습니다. 다음 배포에서 자동으로 만듭니다."
          fi
          {
            echo "### 배포 완료"
            echo ""
            echo "- 주소: $WORKERS_URL"
            echo "- 데이터베이스: D1 \`$D1_NAME\`"
            if [ "$R2_ENABLED" = true ]; then echo "- 사진 저장: R2 ($R2_BUCKET)"
            elif [ -n "${KV_ID:-}" ]; then echo "- 사진 저장: KV (R2 미사용)"
            else echo "- 사진 저장: D1 (R2 미사용)"; fi
            if [ "$push" = on ]; then
              if [ "$VAPID_MAKE" = keys ]; then echo "- 웹 푸시: 켜짐 (키를 이번 배포에서 만듦)"; else echo "- 웹 푸시: 켜짐"; fi
            else echo "- 웹 푸시: 꺼짐"; fi
          } >> "$GITHUB_STEP_SUMMARY"
